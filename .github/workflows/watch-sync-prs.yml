name: Watch Sync Package Pull Requests

on:
    schedule:
        # Poll every 10 minutes for new sync PRs and merged/closed PRs.
        - cron: '*/10 * * * *'

    workflow_dispatch:

    repository_dispatch:
        types:
            - sync-pr-updated

permissions:
    contents: write

concurrency:
    group: watch-sync-prs
    cancel-in-progress: false

jobs:
    watch-sync-prs:
        name: Track Sync PRs and Notify Slack
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}
                  ref: master

            - name: Watch sync pull requests
              env:
                  GH_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
                  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
              run: node scripts/watch-sync-prs.mjs

            - name: Push state changes
              env:
                  GH_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
              run: node scripts/push-state.mjs
